version: '3.8'

services:
  # 1. PostgreSQL 16 Persistent Database
  postgres:
    image: postgres:16-alpine
    container_name: keyhole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyhole_user
      POSTGRES_PASSWORD: keyhole_secure_password
      POSTGRES_DB: keyhole_db
    ports:
      - "5432:5432"
    volumes:
      # Persistent storage volume only - strictly separates persistent data from temp files
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyhole_user -d keyhole_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keyhole-network

  # 2. Redis 7 Ephemeral Store (2-Hour TTL for Temporary Session Data)
  redis:
    image: redis:7-alpine
    container_name: keyhole-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      # Persistent configuration and state only - temporary session keys auto-expire via Redis TTL
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keyhole-network

  # 3. Next.js Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyhole-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://keyhole_user:keyhole_secure_password@postgres:5432/keyhole_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: keyhole-jwt-super-secret-access-token-key-2026-production
      JWT_REFRESH_SECRET: keyhole-jwt-super-secret-refresh-token-key-2026-production
      SESSION_SECRET: keyhole-session-encryption-secret-seed-v2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/auth/github/callback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TEMP_UPLOAD_DIR: /tmp/chatbot-uploads
      MAX_IMAGE_SIZE: 26214400
      MAX_VIDEO_SIZE: 524288000
      MAX_AUDIO_SIZE: 104857600
      FRONTEND_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - keyhole-network

  # 4. NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: keyhole-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - keyhole-network

volumes:
  # Persistent data volumes ONLY - temp files are stored in /tmp/ and destroyed on tab close
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  keyhole-network:
    driver: bridge
